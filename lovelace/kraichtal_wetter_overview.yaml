        show_header_toggle: false
        entities:
          - entity: sensor.kraichtal_wetter_warnungen
          - entity: sensor.kraichtal_wetter_beobachtungsdatum
          - entity: sensor.kraichtal_wetter_beobachtungszeit
          - entity: sensor.kraichtal_wetter_echtzeitdaten

      - type: history-graph
        title: Verlauf der wichtigsten Werte
        entities:
          - sensor.kraichtal_wetter_aussentemperatur
          - sensor.kraichtal_wetter_luftfeuchtigkeit
