          - entity: sensor.kraichtal_wetter_taupunkt
          - entity: sensor.kraichtal_wetter_luftfeuchtigkeit
          - entity: sensor.kraichtal_wetter_luftdruck
          - entity: sensor.kraichtal_wetter_windgeschwindigkeit
          - entity: sensor.kraichtal_wetter_windrichtung
          - entity: sensor.kraichtal_wetter_boen_max
          - entity: sensor.kraichtal_wetter_solarstrahlung

      - type: entities
        title: Station heute (gemessen)
        show_header_toggle: false
        entities:
          - entity: sensor.kraichtal_wetter_station_heute_tmax
          - entity: sensor.kraichtal_wetter_station_heute_tmin
          - entity: sensor.kraichtal_wetter_station_heute_niederschlag
          - entity: sensor.kraichtal_wetter_station_heute_boe
          - entity: sensor.kraichtal_wetter_station_heute_wind_max
          - entity: sensor.kraichtal_wetter_station_heute_luftdruck_max
          - entity: sensor.kraichtal_wetter_station_heute_luftdruck_min

      - type: entities
        title: Prognose für den Rest des Tages
        show_header_toggle: false
        entities:
          - entity: sensor.kraichtal_wetter_prognose_resttag_tmax
          - entity: sensor.kraichtal_wetter_prognose_resttag_tmin
          - entity: sensor.kraichtal_wetter_prognose_resttag_niederschlag

      - type: entities
