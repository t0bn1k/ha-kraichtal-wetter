title: Kraichtal Wetter Übersicht
views:
  - title: Kraichtal Wetter
    path: kraichtal-wetter
    badges:
      - entity: weather.kraichtal_wetter
      - entity: sensor.kraichtal_wetter_outdoor_temperature
      - entity: sensor.kraichtal_wetter_humidity
    cards:
      - type: weather-forecast
        entity: weather.kraichtal_wetter
        name: Kraichtal Wetter

      - type: entities
        title: Aktuelle Werte
        show_header_toggle: false
        entities:
          - entity: sensor.kraichtal_wetter_outdoor_temperature
          - entity: sensor.kraichtal_wetter_feels_like
          - entity: sensor.kraichtal_wetter_dew_point
          - entity: sensor.kraichtal_wetter_humidity
          - entity: sensor.kraichtal_wetter_pressure
          - entity: sensor.kraichtal_wetter_wind_speed
          - entity: sensor.kraichtal_wetter_wind_direction
          - entity: sensor.kraichtal_wetter_max_gust
          - entity: sensor.kraichtal_wetter_solar_irradiance

      - type: entities
        title: Station heute (gemessen)
        show_header_toggle: false
        entities:
          - entity: sensor.kraichtal_wetter_station_max_temperature_today
          - entity: sensor.kraichtal_wetter_station_min_temperature_today
          - entity: sensor.kraichtal_wetter_precipitation
          - entity: sensor.kraichtal_wetter_station_max_gust_today
          - entity: sensor.kraichtal_wetter_station_max_pressure_today
          - entity: sensor.kraichtal_wetter_station_min_pressure_today

      - type: entities
        title: Prognose für den Rest des Tages
        show_header_toggle: false
        entities:
          - entity: sensor.kraichtal_wetter_max_temperature_today
          - entity: sensor.kraichtal_wetter_min_temperature_today
          - entity: sensor.kraichtal_wetter_precipitation_today

      - type: entities
        title: Status
        show_header_toggle: false
        entities:
          - entity: sensor.kraichtal_wetter_warnings
          - entity: sensor.kraichtal_wetter_observation_date
          - entity: sensor.kraichtal_wetter_observation_time
          - entity: sensor.kraichtal_wetter_realtime_data

      - type: history-graph
        title: Verlauf der wichtigsten Werte
        entities:
          - sensor.kraichtal_wetter_outdoor_temperature
          - sensor.kraichtal_wetter_humidity
          - sensor.kraichtal_wetter_pressure
        hours_to_show: 24
