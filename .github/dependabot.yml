# Only GitHub Actions. requirements_test.txt stays manual on purpose: releases
# of pytest-homeassistant-custom-component also pin Home Assistant betas
# (e.g. 0.13.358 = 2026.9.0b0), and Dependabot cannot tell those apart.
# tests-latest.yml shows when a bump is due.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
