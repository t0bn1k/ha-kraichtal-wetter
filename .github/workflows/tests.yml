name: Tests

on:
  push:
    # Branches get their run through the pull request; running on push as
    # well would test every PR commit twice.
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.9 requires Python 3.14.2 or newer.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest --timeout=60
